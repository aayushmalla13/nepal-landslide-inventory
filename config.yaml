paper_metadata:
  study_area: Nepal, 77 districts
  study_period: 2015-2026
  version: 0.6.0
study_period:
  start: '2015-01-01'
  end: '2026-12-31'
paths:
  raw_sqlite_dir: data/raw_sqlite
  intermediate_dir: data/intermediate
  outputs_dir: data/outputs
  caches_dir: data/caches
  logs_dir: data/logs
runtime:
  # Raised from 1.0 on 2026-08-07. At one request per second himalayan-times
  # rate-limited us, and the fetcher stored the 429 error page as the article
  # body -- 615 of its 992 rows, the median row from that outlet. The fetcher
  # now retries and refuses to store error text, but crawling politely is the
  # actual fix. Raise to 8.0 if 429s persist.
  rate_limit_seconds: 3.0
  # Raised from 3. Retries now also cover 429/5xx, which previously were not
  # retried at all.
  retries: 5
  timeout_seconds: 30
  user_agent: landslide-inventory/0.3.0 (+research; contact-user-to-customize)
  max_pages_per_entry_point: 100
  max_urls_per_source: 5000
language_detection:
  devanagari_threshold: 0.3
  mixed_lower: 0.1
  mixed_upper: 0.3
dedup:
  candidate_window_days: 7
  primary_window_days: 3
  headline_sim_threshold: 0.82
  body_sim_threshold: 0.88
  high_body_sim_threshold: 0.96
  guard_deaths_delta: 1
  prefer_same_municipality: true
geocode:
  district_shapefile_path: /absolute/path/to/ocha_districts.shp
  centroid_cache_path: data/caches/district_centroids.csv
  nominatim_cache_db_path: data/caches/nominatim_cache.sqlite
validation:
  article_corrections_path: corrections/article_corrections.csv
  final_release_date: '2026-09-15'
  supersedes_release: nepal_landslide_inventory_v0.5.0_v7_20260915
  manual_sample_total: 150
  manual_en: 75
  manual_np: 75
  random_seed: 42
  locked_test_set:
    # v6 evaluated the pre-2026-09-03 classifier and stays frozen. The
    # gazetteer rebuild and district-evidence corrections are a classifier
    # change, so the project's own rule requires a newly drawn, unlabelled
    # locked set before any extraction-accuracy number can be reported again.
    version: v7
    seed: 20260903
    allocation:
      kept_class1: 130
      kept_class2: 50
      dropped_specificity: 130
      dropped_scope: 70
      dropped_other: 15
      no_extraction: 5
  development_set:
    version: v1
    seed: 20260810
    allocation:
      kept_class1: 60
      kept_class2: 50
      dropped_specificity: 120
      dropped_scope: 60
      dropped_other: 10
bipad:
  bipad_input_path: /absolute/path/to/bipad_landslides.csv
  match_windows_days:
  - 1
  - 3
  - 7
analysis:
  release_version: 0.8.0
  release_date: '20260915'
  # v0.1.0 and v0.2.0 stay on disk as historical baselines. v0.3.0 is the first
  # release built on the 753-unit municipality gazetteer and the corrected
  # district-evidence rules (body "<X> district" phrase outranks the filing
  # dateline; a home-address mention is not an event location; an established
  # district is no longer overridden by a contradicting municipality). Those
  # changes raise district accuracy on the labelled development set from 0.813
  # to 0.862 with no regression, and they move the primary R5 cutpoint from
  # 45.4 mm to 51.6 mm -- a shift well inside the bootstrap interval of either
  # estimate. See docs/RAINFALL_CHANGELOG.md and
  # docs/DISTRICT_ASSIGNMENT_2026-09-03.md.
  supersedes_release: nepal_landslide_rainfall_v0.7.0_20260915
  inventory_release_id: nepal_landslide_inventory_v0.6.0_v7_20260915
  # Daily district means downloaded reproducibly from NASA SERVIR ClimateSERV.
  # R1/R3/R5/R7 windows include the reported event day.
  chirps_daily_district_path: data/external/chirps_daily_districts.csv
  district_boundaries_path: data/reference/nepal_districts_77.geojson
  canonical_events_path: data/outputs/canonical_events_final.csv
  rainfall_product: UCSB CHIRPS v2.0 Final
  antecedent_windows_days: [1, 3, 5, 7]
  min_date_confidence: 0.78
  high_date_confidence: 0.80
  controls_per_event: 5
  control_exclusion_buffer_days: 7
  development_end: '2022-12-31'
  bootstrap_iterations: 1000
  random_seed: 20260813
  # Publishers must contribute at least this many canonical events on BOTH sides
  # of development_end to enter the balanced-panel sensitivity analysis, which
  # separates a temporal effect from publisher turnover.
  balanced_panel_min_events: 30
  correlation_method: spearman
keywords:
  terms:
    en:
    - landslide
    - mudslide
    - debris flow
    - slope failure
    np:
    - पहिरो
    - भूस्खलन
    - ढिस्को
    - माटो खस्नु
  # Project-level metaphor exclusions, read by
  # event_specificity.metaphor_exclude_terms(). These are matched as plain
  # case-folded substrings against title+body, so keep every entry long and
  # specific enough that it cannot occur in a report of a physical landslide.
  # A short fragment here will silently delete real events -- that is precisely
  # how 'by landslide' destroyed 128 of them. Run `--stage pattern_audit` after
  # adding anything.
  exclude:
    en:
    - political landslide
    - electoral landslide
    - stock slide
    - stock market slide
    np:
    - राजनीतिक पहिरो
    - निर्वाचनमा पहिरो
    # Financial-market metaphor: "a 65-point landslide in the share market".
    # A canonical event in the 2026-04 inventory was a stock-market article
    # ("सेयर बजारमा ६५ अंकको पहिरो") -- see docs/TECHNICAL_REVIEW.md section 0.
    - सेयर बजार
    - शेयर बजार
    - नेप्से परिसूचक
  trigger_terms:
    rainfall:
      en:
      - rain
      - rainfall
      - heavy rain
      - monsoon
      - cloudburst
      np:
      - वर्षा
      - अविरल वर्षा
      - भारी वर्षा
      - मनसुन
    earthquake:
      en:
      - earthquake
      - tremor
      np:
      - भूकम्प
      - कम्पन
    road_construction:
      en:
      - road expansion
      - excavator
      - construction
      np:
      - सडक विस्तार
      - डोजर
      - निर्माण
      # Added after an audit found burials by *placed* earth -- spoil heaps,
      # sand piles, plotting sites -- entering the analysis as `unknown`
      # trigger. None of the three terms above is the word those reports use.
      # Each of these is only half the test: the Nepali route now also requires
      # a phrase placing the earthworks at the failure itself
      # (NP_ANTHROPOGENIC_CONTEXT in nlp_np/extract.py).
      - ढिस्को
      - ढिस्का
      - प्लटिङ
      - क्रसर
      - उत्खनन
      - खन्ने
      - खन्दै
  casualty_terms:
    deaths:
      en:
      - killed
      - dead
      - deaths
      np:
      - मृत्यु
      - मृत
      - ज्यान गुमायो
    missing:
      en:
      - missing
      - disappeared
      np:
      - बेपत्ता
      - हराइरहेका
    injured:
      en:
      - injured
      - hurt
      - wounded
      np:
      - घाइते
      - घाइते भएका
doctor:
  spacy_model: en_core_web_sm
external_sources:
  output_csv: data/outputs/external_records.csv
  matching:
    permutations: 100
    seed_discovery:
      endpoint: https://news.google.com/rss/search
      seed_file: external_search_seeds.csv
      output_csv: external_news_candidates.csv
      max_seeds: 50
      max_results_per_query: 20
      statuses: [unmatched]
      priorities: [high]
      timeout_seconds: 30
      retries: 3
      rate_limit_seconds: 1.0
    candidate_ingest:
      max_candidates: 25
      min_text_chars: 200
  timeout_seconds: 45
  retries: 3
  rate_limit_seconds: 0.5
  sources:
  - slug: bipad
    adapter: bipad
    enabled: false
    endpoint: https://bipadportal.gov.np/api/v1/incident/
    public_url: https://bipadportal.gov.np/
    source_family: government_incident
    landslide_only: true
    paginate: true
    max_pages: 100
    params:
      limit: 100
      hazard: 17
      expand: loss,wards,wards.municipality,wards.municipality.district,wards.municipality.district.province
  - slug: drr-portal
    adapter: html_documents
    enabled: false
    listing_urls: [https://drrportal.gov.np/]
    allowed_domains: [drrportal.gov.np]
    max_documents: 200
    source_family: government_archive
  - slug: ndrrma-bulletins
    adapter: ndrrma_bulletins
    enabled: false
    listing_urls: [https://ndrrma.gov.np/en/daily-bulletin]
    allowed_domains: [ndrrma.gov.np]
    max_documents: 500
    source_family: government_bulletin
  - slug: nepal-police
    adapter: nepal_police
    enabled: false
    listing_urls:
    - https://nepalpolice.gov.np/news/
    - https://koshi.nepalpolice.gov.np/news/trending-news/landslide/
    allowed_domains: [nepalpolice.gov.np, koshi.nepalpolice.gov.np]
    max_documents: 500
    source_family: official_response_report
  - slug: armed-police-force
    adapter: armed_police
    enabled: false
    listing_urls: [https://www.apf.gov.np/news]
    allowed_domains: [www.apf.gov.np, apf.gov.np]
    max_documents: 500
    source_family: official_response_report
  - slug: police-road-notices
    adapter: road_notices
    enabled: false
    listing_urls: [https://nepalpolice.gov.np/notices/]
    allowed_domains: [nepalpolice.gov.np]
    record_type: road_obstruction_notice
    max_documents: 500
    source_family: official_road_notice
  - slug: dor-navigate
    adapter: road_closures
    enabled: false
    endpoint: https://navigate-dor-api.rimes.int/Road_closure_history_api/getHistoryPaginated
    public_url: https://navigate.dor.gov.np/app/road-closure-history
    source_family: official_road_database
    record_type: road_obstruction
    landslide_only: true
    max_pages: 50
    params:
      year: 0
      month: 0
  - slug: kantipur-epaper
    adapter: kantipur_epaper
    enabled: false
    start: '2024-09-16'
    end: '2026-12-31'
    publications: [kantipur, kathmandupost]
    monsoon_only: true
    months: [6, 7, 8, 9]
    max_documents: 100
    cookie_env: KANTIPUR_EPAPER_COOKIE
    url_templates:
    - https://epaper.ekantipur.com/{publication}/download/{date}
  - slug: wayback-ekantipur
    adapter: wayback_cdx
    enabled: false
    endpoint: https://web.archive.org/cdx/search/cdx
    url_pattern: ekantipur.com/*
    from: '2015'
    to: '2026'
    limit: 5000
    fetch_bodies: false
    max_body_fetches: 200
  - slug: common-crawl-ekantipur
    adapter: common_crawl
    enabled: false
    # The current Common Crawl collection has no eKantipur captures; pin an
    # older collection that does, so historical recovery is reproducible.
    index_url: https://index.commoncrawl.org/CC-MAIN-2023-50-index
    url_pattern: '*.ekantipur.com/*'
    limit: 5000
    fetch_bodies: false
    max_body_fetches: 200
  - slug: media-cloud
    adapter: media_cloud
    enabled: false
    endpoint: https://search.mediacloud.org/api/search/story-list
    token_env: MEDIACLOUD_API_KEY
    query: landslide Nepal OR पहिरो
    start: '2015-01-01'
    end: '2026-12-31'
    max_pages: 100
    page_delay_seconds: 30
  - slug: nasa-coolr
    adapter: coolr
    enabled: false
    endpoint: https://gis.earthdata.nasa.gov/gis05/rest/services/Landslides/COOLR_Events_Polygons/FeatureServer/0
    public_url: https://gpm.nasa.gov/applications/landslides/coolr
    where: country_name = 'Nepal'
    batch_size: 2000
    max_pages: 10
  - slug: reliefweb
    adapter: reliefweb
    enabled: false
    endpoint: https://api.reliefweb.int/v2/reports
    appname_env: RELIEFWEB_APPNAME
    query: Nepal landslide
    max_pages: 20
  - slug: desinventar
    adapter: desinventar
    enabled: false
    input_path: data/external/desinventar_nepal.csv
    source_family: historical_disaster_database
    record_type: disaster_loss_record
    landslide_only: true
    mapping:
      id: [serial, id]
      title: [event, disaster]
      text: [comments, description]
      incident_date: [date, event_date]
      hazard_type: [event, hazard]
      district: [district, level1]
      municipality: [municipality, level2]
      deaths: [deaths, killed]
      injured: [injured]
      missing: [missing]
  - slug: official-social-feed
    adapter: rss
    enabled: false
    endpoint: https://example.invalid/official-landslide-feed.xml
    probe_enabled: false
    source_family: official_social_feed
    record_type: official_alert
