paper_metadata:
  study_area: Nepal, 77 districts
  study_period: 2015-2026
  version: 0.1.0
study_period:
  start: '2015-01-01'
  end: '2026-12-31'
paths:
  raw_sqlite_dir: data/raw_sqlite
  intermediate_dir: data/intermediate
  outputs_dir: data/outputs
  caches_dir: data/caches
  logs_dir: data/logs
runtime:
  rate_limit_seconds: 1.0
  retries: 3
  timeout_seconds: 30
  user_agent: landslide-inventory/0.1.0 (+research; contact-user-to-customize)
  max_pages_per_entry_point: 100
  max_urls_per_source: 5000
language_detection:
  devanagari_threshold: 0.3
  mixed_lower: 0.1
  mixed_upper: 0.3
dedup:
  candidate_window_days: 7
  primary_window_days: 3
  headline_sim_threshold: 0.82
  body_sim_threshold: 0.88
  high_body_sim_threshold: 0.96
  guard_deaths_delta: 1
  prefer_same_municipality: true
geocode:
  district_shapefile_path: /absolute/path/to/ocha_districts.shp
  centroid_cache_path: data/caches/district_centroids.csv
  nominatim_cache_db_path: data/caches/nominatim_cache.sqlite
validation:
  manual_sample_total: 150
  manual_en: 75
  manual_np: 75
  random_seed: 42
bipad:
  bipad_input_path: /absolute/path/to/bipad_landslides.csv
  match_windows_days:
  - 1
  - 3
  - 7
analysis:
  chirps_district_month_path: /absolute/path/to/chirps_district_month.csv
  correlation_method: spearman
keywords:
  terms:
    en:
    - landslide
    - mudslide
    - debris flow
    - slope failure
    np:
    - पहिरो
    - भूस्खलन
    - ढिस्को
    - माटो खस्नु
  exclude:
    en:
    - political landslide
    - electoral landslide
    - stock slide
    np:
    - राजनीतिक पहिरो
    - निर्वाचनमा पहिरो
  trigger_terms:
    rainfall:
      en:
      - rain
      - rainfall
      - heavy rain
      - monsoon
      - cloudburst
      np:
      - वर्षा
      - अविरल वर्षा
      - भारी वर्षा
      - मनसुन
    earthquake:
      en:
      - earthquake
      - tremor
      np:
      - भूकम्प
      - कम्पन
    road_construction:
      en:
      - road expansion
      - excavator
      - construction
      np:
      - सडक विस्तार
      - डोजर
      - निर्माण
  casualty_terms:
    deaths:
      en:
      - killed
      - dead
      - deaths
      np:
      - मृत्यु
      - मृत
      - ज्यान गुमायो
    missing:
      en:
      - missing
      - disappeared
      np:
      - बेपत्ता
      - हराइरहेका
    injured:
      en:
      - injured
      - hurt
      - wounded
      np:
      - घाइते
      - घाइते भएका
doctor:
  spacy_model: en_core_web_sm
